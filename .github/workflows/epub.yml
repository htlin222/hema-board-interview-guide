name: Build EPUB

on:
  push:
    branches: [main]
    paths:
      - 'src/content/docs/topics/**.md'
      - 'scripts/build_epub.py'
      - '.github/workflows/epub.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc fonts-noto-cjk

      # 封面用的中文字型路徑在 Linux 上不同
      - name: Point cover font at the runner's CJK font
        run: |
          sed -i 's|/System/Library/Fonts/STHeiti Medium.ttc|/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc|' scripts/build_epub.py

      - name: Build
        run: uv run --script scripts/build_epub.py

      - name: Validate
        run: |
          curl -sL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          unzip -q epubcheck.zip
          java -jar epubcheck-5.1.0/epubcheck.jar dist-epub/hema-board-interview.epub

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=epub-latest
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "EPUB（最新）" \
                 --notes "由 main 分支的主題頁自動建置，經 epubcheck 驗證。"
          gh release upload "$tag" dist-epub/hema-board-interview.epub --clobber
